name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Lint & Test ─────────────────────────────────────────────────────────────
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest httpx
        pip install -r server/requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check server/

    - name: Validate docker-compose syntax
      run: |
        cd deployment
        docker compose config --quiet

    - name: Run unit tests
      # H2 FIX — PYTHONPATH must include server/ so that `from app.main import ...`
      # resolves correctly.  Without this, pytest exits immediately with
      # ModuleNotFoundError: No module named 'app'.
      env:
        PYTHONPATH: server
      run: |
        pytest server/tests/ -v --tb=short

  # ── Docker Build ────────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t dermatology-api:test -f server/Dockerfile .
