apiVersion: apps/v1
kind: Deployment
metadata:
  name: dermatology-api-deployment
  labels:
    app: dermatology-api
    version: "2.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dermatology-api
  template:
    metadata:
      labels:
        app: dermatology-api
    spec:
      containers:
      - name: dermatology-api
        image: dermatology-api:latest
        ports:
        - containerPort: 8000
        env:
        # Fix #1 — model filename reflects actual architecture (ResNet-18, not EfficientNet)
        - name: MODEL_PATH
          value: "/models/resnet18_quant_int8.onnx"
        - name: PYTHONUNBUFFERED
          value: "1"
        # Fix #7 — replace with your ingress domain in production
        - name: ALLOWED_ORIGINS
          value: "https://your-production-domain.com"
        # Fix #8 — reference a Kubernetes Secret in production instead of plain text
        - name: METRICS_API_KEY
          valueFrom:
            secretKeyRef:
              name: dermatology-secrets
              key: metrics-api-key
              optional: true            # allows the pod to start even if secret is absent
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
          # Uncomment below to enable GPU on a GPU-capable node pool:
          # limits:
          #   nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: dermatology-api-service
spec:
  selector:
    app: dermatology-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
