services:
  dermatology-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: dermatology-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../models:/models:ro          # read-only model mount
    environment:
      # Fix #1 — model filename reflects actual architecture (ResNet-18, not EfficientNet)
      - MODEL_PATH=/models/resnet18_quant_int8.onnx
      - PYTHONUNBUFFERED=1
      # Fix #7 — for local Docker dev it is acceptable to allow all origins;
      # replace with your production domain(s) in a real deployment.
      - ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      # Fix #8 — set a strong secret here in production to protect /metrics.
      # Leave blank to disable auth (dev only).
      - METRICS_API_KEY=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s              # give model time to load before first probe
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
